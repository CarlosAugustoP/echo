x-rabbitmq-env: &rabbitmq-env
  RabbitMqSettings__Host: ${RABBITMQ_HOST:-rabbitmq}
  RabbitMqSettings__VirtualHost: ${RABBITMQ_VHOST:-/}
  RabbitMqSettings__Username: ${RABBITMQ_USERNAME:-guest}
  RabbitMqSettings__Password: ${RABBITMQ_PASSWORD:-guest}

x-api-config: &api-config
  ConnectionStrings__DefaultConnection: "${ECHO_CONNECTION_STRING:-}"
  BlockChainSettings__RpcUrl: ${BLOCKCHAIN_RPC_URL:-}
  BlockChainSettings__EthereumPrivateKey: ${BLOCKCHAIN_PRIVATE_KEY:-}
  BlockChainSettings__EthereumAccountAddress: ${BLOCKCHAIN_ACCOUNT_ADDRESS:-}
  BlockChainSettings__ChainId: ${BLOCKCHAIN_CHAIN_ID:-11155111}
  JwtSettings__SecretKey: ${JWT_SECRET_KEY:-}
  JwtSettings__Expiration: ${JWT_EXPIRATION_HOURS:-8}
  JwtSettings__Issuer: ${JWT_ISSUER:-EchoProject}
  AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
  Supabase__Url: ${SUPABASE_URL:-}
  Supabase__Key: ${SUPABASE_KEY:-}
  Supabase__BucketName: ${SUPABASE_BUCKET_NAME:-echo-public-bucket}

x-worker-config: &worker-config
  ConnectionStrings__DefaultConnection: "${ECHO_CONNECTION_STRING:-}"
  BlockChainSettings__RpcUrl: ${BLOCKCHAIN_RPC_URL:-}
  BlockChainSettings__EthereumPrivateKey: ${BLOCKCHAIN_PRIVATE_KEY:-}
  BlockChainSettings__EthereumAccountAddress: ${BLOCKCHAIN_ACCOUNT_ADDRESS:-}
  BlockChainSettings__ChainId: ${BLOCKCHAIN_CHAIN_ID:-11155111}

services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echo-network

  echo-api:
    image: echo-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      <<: [*rabbitmq-env, *api-config]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - echo-network

  echo-worker:
    image: echo-worker:local
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      <<: [*rabbitmq-env, *worker-config]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - echo-network

networks:
  echo-network:
    driver: bridge
